# Build every pull request. On pushes to main or develop, build both branches
# and deploy them together to GitHub Pages: main at /json-db/, develop at
# /json-db/dev/. A Pages site is a single artifact, so each deploy has to carry
# both builds.
name: Build and deploy to Pages

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: newer pushes cancel older checks.
# Deploys: one at a time, never cancelled mid-way; every deploy builds both
# branches at their latest commit, so a queued run always ships the newest code.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Same name as before, so required status checks keep matching.
    name: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - branch: main
            base: /json-db/
            namespace: json-db
          - branch: develop
            base: /json-db/dev/
            namespace: json-db-dev
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ matrix.base }}
          VITE_STORAGE_NAMESPACE: ${{ matrix.namespace }}
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.branch }}
          path: ./dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download main build
        uses: actions/download-artifact@v8
        with:
          name: site-main
          path: site
      - name: Download develop build
        uses: actions/download-artifact@v8
        with:
          name: site-develop
          path: site/dev
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
