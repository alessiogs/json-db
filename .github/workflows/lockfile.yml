# Temporary: regenerate package-lock.json on a runner and report build and lint.
name: Regenerate lockfile
on:
  push:
    branches: ["fix/ci"]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: npm run build
        continue-on-error: true
      - run: npm run lint
        continue-on-error: true
      - name: Commit lockfile
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: regenerate package-lock.json" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012piKpxWS6z6PKih3ctb1Hn"
          git push
